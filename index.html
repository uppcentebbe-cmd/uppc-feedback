<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPPC Feedback</title>

<style>
body{
  font-family:"Segoe UI", Arial, sans-serif;
  background:linear-gradient(135deg,#0d1b2a,#1b263b);
  margin:0;
  padding:10px;
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  background:#fff;
  border-radius:18px;
  padding:15px;
}

/* HEADER */
.header{
  text-align:center;
  padding:10px;
  background:rgba(0,0,0,0.7);
  backdrop-filter:blur(12px);
  border-radius:12px;
}

.logo{
  width:100%;
  max-height:90px;
  object-fit:contain;
}

/* INTRO */
.intro{
  display:flex;
  justify-content:space-between;
  background:#eef3f7;
  padding:10px;
  border-radius:8px;
  margin:10px 0;
  font-size:14px;
}

/* QUESTION */
.question{
  margin-top:12px;
  padding:12px;
  background:#f5f7fa;
  border-radius:12px;
}

.question h3{
  text-align:center;
  font-size:18px;
  margin-bottom:10px;
}

/* GRID (RESPONSIVE) */
.emoji-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(110px,1fr));
  gap:10px;
}

/* CARD */
.emoji-card{
  background:#fff4cc;
  border-radius:14px;
  text-align:center;
  padding:12px;
  cursor:pointer;
  border:2px solid transparent;
  transition:0.25s;
}

.emoji-card input{ display:none; }

/* EMOJI */
.emoji{
  font-size: clamp(50px, 9vw, 95px);
  filter: drop-shadow(0 10px 15px rgba(255,140,0,0.4));
}

/* TEXT */
.emoji-card span{
  display:block;
  margin-top:6px;
  font-size:13px;
}

/* SELECTED */
.emoji-card input:checked + .emoji{
  transform:scale(1.25);
}

.emoji-card:has(input:checked){
  background:rgba(255,200,200,0.6);
  border:2px solid red;
}

/* THANK YOU */
#thankyou{
  display:none;
  text-align:center;
  padding:60px 20px;
}

#thankEmoji{
  font-size:110px;
}

#thankMessage{
  font-size:22px;
}

/* TABLET */
@media(max-width:768px){
  .emoji-grid{
    grid-template-columns: repeat(3,1fr);
  }
}

/* PHONE */
@media(max-width:480px){
  .emoji-grid{
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<div id="mainContent">

<div class="header">
  <img src="UPPC-LOGO.png" class="logo">
</div>

<div class="intro">
  <span><b>Share your feedback</b></span>
  <span>Help us improve</span>
</div>

<form id="feedbackForm">

<!-- PRODUCT -->
<div class="question">
<h3>Rate Product Quality</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="product_quality" value="Very Poor"><div class="emoji">😡</div><span>Very Poor</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Poor"><div class="emoji">🙁</div><span>Poor</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Average"><div class="emoji">😐</div><span>Average</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Good"><div class="emoji">🙂</div><span>Good</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Excellent"><div class="emoji">🤩</div><span>Excellent</span></label>
</div>
</div>

<!-- SERVICE -->
<div class="question">
<h3>Rate Service Quality</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="service_quality" value="Very Poor"><div class="emoji">😡</div><span>Very Poor</span></label>
<label class="emoji-card"><input type="radio" name="service_quality" value="Poor"><div class="emoji">🙁</div><span>Poor</span></label>
<label class="emoji-card"><input type="radio" name="service_quality" value="Average"><div class="emoji">😐</div><span>Average</span></label>
<label class="emoji-card"><input type="radio" name="service_quality" value="Good"><div class="emoji">🙂</div><span>Good</span></label>
<label class="emoji-card"><input type="radio" name="service_quality" value="Excellent"><div class="emoji">🤩</div><span>Excellent</span></label>
</div>
</div>

<!-- CUSTOMER -->
<div class="question">
<h3>Rate Customer Service</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="customer_service" value="Very Poor"><div class="emoji">😡</div><span>Very Poor</span></label>
<label class="emoji-card"><input type="radio" name="customer_service" value="Poor"><div class="emoji">🙁</div><span>Poor</span></label>
<label class="emoji-card"><input type="radio" name="customer_service" value="Average"><div class="emoji">😐</div><span>Average</span></label>
<label class="emoji-card"><input type="radio" name="customer_service" value="Good"><div class="emoji">🙂</div><span>Good</span></label>
<label class="emoji-card"><input type="radio" name="customer_service" value="Excellent"><div class="emoji">🤩</div><span>Excellent</span></label>
</div>
</div>

<!-- OVERALL -->
<div class="question">
<h3>Rate Overall Experience</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="overall" value="Very Poor"><div class="emoji">😡</div><span>Very Poor</span></label>
<label class="emoji-card"><input type="radio" name="overall" value="Poor"><div class="emoji">🙁</div><span>Poor</span></label>
<label class="emoji-card"><input type="radio" name="overall" value="Average"><div class="emoji">😐</div><span>Average</span></label>
<label class="emoji-card"><input type="radio" name="overall" value="Good"><div class="emoji">🙂</div><span>Good</span></label>
<label class="emoji-card"><input type="radio" name="overall" value="Excellent"><div class="emoji">🤩</div><span>Excellent</span></label>
</div>
</div>

<!-- RECOMMEND -->
<div class="question">
<h3>Would you recommend UPPC?</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="recommend" value="No"><div class="emoji">❌</div><span>No</span></label>
<label class="emoji-card"><input type="radio" name="recommend" value="Maybe"><div class="emoji">🤔</div><span>Maybe</span></label>
<label class="emoji-card"><input type="radio" name="recommend" value="Yes"><div class="emoji">✅</div><span>Yes</span></label>
</div>
</div>

</form>
</div>

<!-- THANK YOU -->
<div id="thankyou">
  <div id="thankEmoji">😊</div>
  <h2 id="thankMessage"></h2>
</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function(){

const scriptURL="https://script.google.com/macros/s/AKfycbwVD0Rt1PdxrgSZ8AFfAxauML947NXbuHDV5iA65azyMU6cOMqsc3JJ0LCA4oz9TsR1/exec";

const form=document.getElementById("feedbackForm");
const cards=document.querySelectorAll(".emoji-card");

let isSubmitting=false;

cards.forEach(card=>{
  card.addEventListener("click", function(){

    const input=card.querySelector("input");
    input.checked=true;

    if(input.name==="recommend"){
      setTimeout(autoSubmit,150);
    }
  });
});

function autoSubmit(){

  if(isSubmitting) return;
  isSubmitting=true;

  const getVal = name =>
    document.querySelector(`input[name="${name}"]:checked`)?.value || "";

  const params = new URLSearchParams({
    product_quality: getVal("product_quality"),
    service_quality: getVal("service_quality"),
    customer_service: getVal("customer_service"),
    overall: getVal("overall"),
    recommend: getVal("recommend")
  });

  const img=new Image();
  img.src = scriptURL + "?" + params.toString();

  showThankYou(getVal("overall"));

  setTimeout(fullReset,3000);
}

function showThankYou(rating){

  const emoji=document.getElementById("thankEmoji");
  const message=document.getElementById("thankMessage");

  let emo="😊";
  let msg="Thanks for sharing your valuable feedback with us";

  if(rating==="Very Poor"){ emo="😡"; msg="We’re sorry. We will improve."; }
  else if(rating==="Poor"){ emo="🙁"; msg="We’ll improve."; }
  else if(rating==="Average"){ emo="😐"; msg="Thank you."; }
  else if(rating==="Good"){ emo="🙂"; msg="Glad you had a good experience."; }
  else if(rating==="Excellent"){ emo="🤩"; msg="Fantastic! Thank you!"; }

  emoji.innerHTML=emo;
  message.innerHTML=msg;

  document.getElementById("mainContent").style.display="none";
  document.getElementById("thankyou").style.display="block";
}

function fullReset(){

  form.reset();

  document.querySelectorAll("input").forEach(i=>i.checked=false);

  document.getElementById("thankyou").style.display="none";
  document.getElementById("mainContent").style.display="block";

  isSubmitting=false;
}

});
</script>

</body>
</html>
