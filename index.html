<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPPC Feedback</title>

<style>
body{
  font-family:"Segoe UI", Arial, sans-serif;
  background:linear-gradient(135deg,#0d1b2a,#1b263b);
  margin:0;
  padding:10px;
}

.container{
  max-width:950px;
  margin:auto;
  background:#fff;
  border-radius:16px;
  padding:15px;
  box-shadow:0 15px 40px rgba(0,0,0,0.4);
}

/* HEADER */
.header{
  text-align:center;
  margin-bottom:8px;
  padding:12px 0;
  background:rgba(0,0,0,0.65);
  backdrop-filter:blur(10px);
  border-radius:12px;
}

.logo{
  max-width:100%;
}

/* INTRO */
.intro{
  display:flex;
  justify-content:space-between;
  background:#eef3f7;
  padding:8px 15px;
  border-radius:10px;
  margin:8px 0;
}

.intro .title{font-weight:600;}
.intro .sub{font-size:13px;color:#666;}

/* QUESTION */
.question{
  margin-top:15px;
  padding:15px;
  background:#f4f6f8;
  border-radius:12px;
}

.question h3{
  text-align:center;
  font-size:22px;
}

/* GRID */
.emoji-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:12px;
}

.emoji-card{
  background:#fff4cc;
  border-radius:14px;
  text-align:center;
  padding:18px;
  cursor:pointer;
  border:2px solid transparent;
}

.emoji-card input{display:none;}

.emoji{
  font-size:90px;
  transition:0.2s;
}

.emoji-card span{
  display:block;
  font-size:14px;
}

/* SELECTED */
.emoji-card input:checked + .emoji{
  transform:scale(1.25);
}

.emoji-card:has(input:checked){
  background:#ffe5e5;
  border:2px solid red;
}

/* THANK YOU SCREEN */
#thankyou{
  display:none;
  text-align:center;
  padding:60px 20px;
}

#thankyou .emoji{
  font-size:100px;
}

#thankyou h2{
  font-size:26px;
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container" id="mainContent">

<div class="header">
  <img src="UPPC-LOGO.png" class="logo">
</div>

<div class="intro">
  <span class="title">Share your feedback</span>
  <span class="sub">Help us improve</span>
</div>

<form id="feedbackForm">

<!-- 1 -->
<div class="question">
<h3>Rate Product Quality</h3>
<div class="emoji-grid">
<label class="emoji-card"><input type="radio" name="product_quality" value="Very Poor"><div class="emoji">😡</div><span>Very Poor</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Poor"><div class="emoji">🙁</div><span>Poor</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Average"><div class="emoji">😐</div><span>Average</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Good"><div class="emoji">🙂</div><span>Good</span></label>
<label class="emoji-card"><input type="radio" name="product_quality" value="Excellent"><div class="emoji">🤩</div><span>Excellent</span></label>
</div>
</div>

<!-- Repeat same structure for all other sections -->

</form>

</div>

<!-- THANK YOU -->
<div id="thankyou">
  <div class="emoji">🎉😊</div>
  <h2>Thanks for sharing your valuable feedback with us</h2>
</div>

<script>
const scriptURL=""https://script.google.com/macros/s/AKfycbz8N639PngHX28Ilyr4f9lu9-WSlNBrJ3lqf4yEdHgv0ImLNWTQoAWu3DtGgQPLOBNd/exec";";

const inputs=document.querySelectorAll("input[type=radio]");
const form=document.getElementById("feedbackForm");

const fields=["product_quality","service_quality","customer_service","overall","recommend"];

inputs.forEach(input=>{
  input.addEventListener("change",()=>{
    let answered=0;

    fields.forEach(f=>{
      if(document.querySelector(`input[name="${f}"]:checked`)){
        answered++;
      }
    });

    // 🚀 AUTO SUBMIT
    if(answered===fields.length){
      autoSubmit();
    }
  });
});

function autoSubmit(){
  fetch(scriptURL,{
    method:"POST",
    body:new FormData(form)
  }).then(()=>{
    
    document.getElementById("mainContent").style.display="none";
    document.getElementById("thankyou").style.display="block";

    // 🔄 RESET AFTER 3 SECONDS
    setTimeout(()=>{
      form.reset();
      document.getElementById("thankyou").style.display="none";
      document.getElementById("mainContent").style.display="block";
    },3000);

  });
}
</script>

</body>
</html>
